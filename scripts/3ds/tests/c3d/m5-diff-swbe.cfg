# M5 acceptance: landscapes, static and the full frame (landscapes included, static excluded both sides), lit, in C3D
# against SW (design 7 "M5 specification"), 20 checks (every frame) at a bench spot.
# Run: SCENARIO_SRC=".../Marathon 2" scripts/3ds/run-azahar.sh --perf 6 --c3d scripts/3ds/tests/c3d/m5-diff.cfg build-3ds-c3d-prof/alephone.3dsx (L0/L6/L20)
# Software backend variant: gxq_budget 3 (no promotions: every texture linear; M3 Review log "software-backend films").
# Then: c3d-diff.py log <log> --colour landscape --shading lit --strict landscape --nonedge-pct 0.1 --within 98 --tol 2 --mean 255 --min-checks 20 --min-covered 2000 --min-covered-checks 10
#  and: c3d-diff.py log <log> --colour frame --shading lit --within 97 --tol 4 --mean 255 --min-checks 20
#  and (if it shows static): c3d-diff.py log <log> --static --min-covered 40000
renderer c3d
diff 1
diff_frames 20
classes landscape,static,frame
fullbright 0
textures 1
lit 1
diff_tol 4
landscape_tol 2
dump 0
play 0          # diff runs only: play mode has its own runs (m5-play*.cfg)
gxq_budget 3
