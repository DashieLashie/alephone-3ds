# M5 acceptance (critic, M5 code review major 2): the landscape's second texture part and the polygons that cross the
# cut. Marathon 2's pitch (~30 degrees) never shows rows past 512, so the test key land_cut 400 moves the cut into the
# middle of the sky rows on screen (measured c3d_land_rows: L6 319-500, L0 302-500) and the Look Up Test plugin sways the
# view between 14 and 28 degrees, so the cut crosses the screen; diff every 3rd frame, 60 checks, landscape and frame.
# Run: scripts/3ds/run-azahar.sh --perf 6 --look-up-test --c3d scripts/3ds/tests/c3d/m5-lookup.cfg build-3ds-c3d-prof/alephone.3dsx (L0, L6)
# Software backend: m5-lookup-swbe.cfg (gxq_budget 3).
# Then: c3d-diff.py log <log> --colour landscape --shading lit --strict landscape --nonedge-pct 0.1 --within 98 --tol 2 --mean 255 --min-checks 60 --min-covered 2000 --min-covered-checks 10
#  and: c3d-diff.py log <log> --colour frame --shading lit --within 97 --tol 4 --mean 255 --min-checks 60
#  and the DIFF summary: c3d_land_spans > 0 (cut-crossing polygons drawn), the texcache part-1 creates, ring_hw_v.
renderer c3d
diff 3
diff_frames 60
classes landscape,frame
fullbright 0
textures 1
lit 1
diff_tol 4
landscape_tol 2
land_cut 400    # test only (core/config.h)
dump 0
play 0          # diff runs only
