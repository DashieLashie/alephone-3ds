# M2 acceptance (session 2): walls and floors textured, full bright, in C3D against SW (design 7 "M2 specification").
# Orientation run first ("View frame with textures"): 3 checks on L0 with dumps, run on build-3ds-c3d-prof and on
# build-3ds-c3d-noflip-prof (-DA1_C3D_TILE_NOFLIP=ON: rows stored unflipped); the right row order wins clearly.
# Run: SCENARIO_SRC=".../Marathon 2" scripts/3ds/run-azahar.sh --perf 0 --c3d scripts/3ds/tests/c3d/m2-orient.cfg <build>/alephone.3dsx
# Then: compare the DIFF lines' within_nb / mean_nb of both builds, and the c3d-diff-*-{sw,c3d}.png dumps by eye.
renderer c3d
diff 1
diff_frames 3
classes walls,floors
fullbright 1
textures 1
dump 1
play 0          # M4: no C3D play frames, as before M4 (design 7, M4 specification "Keys")
