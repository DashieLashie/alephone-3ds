# M0 revise 1: the readback calibration with the resize path. As m0-readback-cal.cfg, but every odd
# calibration frame uses a view 8 pixels narrower and lower (392x232 for 400x240), so the target and
# the readback buffers are deleted and created again on every frame (out of frame:
# C3D_RenderTargetDelete svcBreaks inside one).
# Run: SCENARIO_SRC=".../Marathon 2" scripts/3ds/run-azahar.sh --perf 0 --c3d scripts/3ds/tests/c3d/m0-readback-cal-resize.cfg build-3ds-c3d-prof/alephone.3dsx
# Expect: the same 30 ok lines and the same summary as m0-readback-cal.cfg ("30 frames, orientation ok 30,
# current frame ok 30, channels ok 30, mismatched pixels 0 (sentinel 0), skipped 0"); the log shows
# "[c3d] view: ... target deleted" and "unlinked RGBA8 target" lines alternating between the two sizes;
# no guest fault. c3d-rbcal-29.bmp is 392x232 (frame 29 is odd), c3d-rbcal-0.bmp 400x240.
readback_cal 1
readback_cal_resize 1
dump 1
