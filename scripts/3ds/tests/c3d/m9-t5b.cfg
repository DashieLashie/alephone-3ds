# M9 part 1, T5b (design 7, M9 specification "Additions to the tests"): stereo_fail 1 treats the second view texture's allocation as failed.
# Expect: one "[c3d] stereo: off for the run (vram)" line, "stereo final" absent or stereo=0 (stereo_force 1 asks for the stereo path on every direct frame and
# gets none), off=vram, and M6's direct gates otherwise unchanged (every direct_check within_1 >= 99.9 %, over_32 0).
# Run: scripts/3ds/run-azahar.sh --perf 0 --c3d scripts/3ds/tests/c3d/m9-t5b.cfg build-3ds-c3d-prof/alephone.3dsx
renderer c3d
mode direct
play 1
textures 1
lit 1
overlays 1
direct_check 30
overlay_audit 30
seed_check 1
stereo 1
stereo_force 1
stereo_slider 0
stereo_fail 1
stereo_check 30
