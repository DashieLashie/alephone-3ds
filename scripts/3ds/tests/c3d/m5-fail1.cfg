# M5 acceptance: every texture create() fails (design 7, M5 specification "fail_every"): every C3D play frame that needs
# a new texture discards `tex`, so the renderer goes off after 10 in a row; with the Level Hop Test plugin (the next
# level 10 s in) on L20's bench spot it must go off on level 20, on again at the level change, off again on level 21.
# Run: scripts/3ds/run-azahar.sh --perf 20 --level-hop-test --c3d scripts/3ds/tests/c3d/m5-fail1.cfg build-3ds-c3d-prof/alephone.3dsx
# Then: c3d-diff.py play <log> --expect-offs 2 --off-reason tex
renderer c3d
play 1
textures 1
lit 1
fail_every 1
