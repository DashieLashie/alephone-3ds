# M5 acceptance: the static density gate (design 7, M5 specification "Colour and density gates": pooled, sum of SW's
# coverage >= 40 000) over the static-heavy film M2 L06 We're Everywhere, every 2nd frame, classes static and frame.
# Run: scripts/3ds/run-azahar.sh --c3d scripts/3ds/tests/c3d/m5-static-film.cfg --film "tests/replays/Marathon 2/Tooncinator Films/M2 L06 We're Everywhere.46946.filA" --timeout 400 build-3ds-c3d-prof/alephone.3dsx
# Software backend variant: gxq_budget 3 (no promotions).
# Then: c3d-diff.py log <log> --static --min-covered 40000 --min-checks 100
#  and: c3d-diff.py log <log> --colour frame --shading lit --within 97 --tol 4 --mean 255 --min-checks 100
renderer c3d
diff 2
diff_frames 450     # checks; the film runs ~975 frames (~488 checks at diff 2): 800 never reached the summary
classes static,frame
fullbright 0
textures 1
lit 1
diff_tol 4
dump 0
film c3d-film.filA
play 0          # diff runs only
gxq_budget 3
