# M6b, Azahar software backend (AZAHAR_GRAPHICS_API=0, gxq_budget 3): fades in direct mode (design 7, M6b specification "Tests"): with the Fade Test or the Liquid Test plugin, every
# 5th direct frame checked against SW's apply_gamma of the same frame (direct_check with the frame's curves).
# Run: AZAHAR_GRAPHICS_API=0 PERF_SETTLE=2 PERF_MEASURE=70 scripts/3ds/run-azahar.sh --perf 0 --fade-test --c3d scripts/3ds/tests/c3d/m6b-fade-swbe.cfg build-3ds-c3d-prof/alephone.3dsx
# Expect: one "[c3d] fade: curves changed" line per "[lua] fade" line; every direct_check with fade=1 within_2 >= 99.9 %
# and max <= 4; "composite final" fade_bad=0, leaks=0.
renderer c3d
mode direct
play 1
textures 1
lit 1
overlays 2
direct_check 5
overlay_audit 30
gxq_budget 3
