# M6b: direct mode over the L01 film with fades on (the default): blocked=gamma only for curves no part classifies;
# every 30th direct frame checked (fade frames against SW's apply_gamma).
# Run: scripts/3ds/run-azahar.sh --c3d scripts/3ds/tests/c3d/m6b-film.cfg --film FILM --timeout 500 build-3ds-c3d-prof/alephone.3dsx
renderer c3d
play 1
textures 1
lit 1
mode direct
overlays 1
direct_check 30
overlay_audit 30
film c3d-film.filA
