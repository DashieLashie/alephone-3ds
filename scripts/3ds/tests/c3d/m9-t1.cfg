# M9 part 2, T1 (design 7, M9 specification "Tests"): the stereo calibration. stereo_cal 1 draws, instead of the world, five
# 16x16 flat quads at depths w0/2, w0, 2*w0, kWPerspMax (and one at the left edge) with P = 8, near 1, no fill, both eye
# textures cleared to black; every composite of the first 30 checks the quads in both textures (read back, 512 columns) and
# in both top-screen framebuffers.
# Run: scripts/3ds/run-azahar.sh --perf 0 --c3d scripts/3ds/tests/c3d/m9-t1.cfg build-3ds-c3d-prof/alephone.3dsx
# No `overlays` key: the test overlay (FPS, position, a message) is drawn over rows 100-125 at the left edge and would cover quads 0 and 4
# in the framebuffer check.
# Expect: 30 lines "[c3d] stereo_cal: tex L 5/5 R 5/5 fb L 5/5 R 5/5" and "composite final" cal_frames=30 cal_complete=30.
renderer c3d
mode direct
play 1
textures 1
lit 1
stereo 1
stereo_cal 1
stereo_fill 0
stereo_slider 100
