# M9 part 2 review follow-up: the gap count at P = 0 (design 7, M9 "What the two textures hold"): stereo_force 1 with stereo_slider 0 makes every direct
# frame a stereo frame with no parallax, stereo_fill 0 and stereo_gaps 1 clear both textures to magenta first: gap_px = the pixels no draw
# covers at P = 0 (cracks between independently clipped polygons, tie pixels). Reported, not gated.
# Run: scripts/3ds/run-azahar.sh --perf 0 --c3d scripts/3ds/tests/c3d/m9-t4-p0.cfg build-3ds-c3d-prof/alephone.3dsx (also --perf 6 / 20)
renderer c3d
mode direct
play 1
textures 1
lit 1
stereo 1
stereo_force 1
stereo_slider 0
stereo_fill 0
stereo_gaps 1
