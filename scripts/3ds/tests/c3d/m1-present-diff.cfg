# M1: the present is unharmed by C3D view frames (design 7, M1 "State save and restore"). Walls diff
# frames (world program, AttrInfo and BufInfo of their own, restored afterwards) interleaved with the
# GPU present's self-check: every 30th present is compared with the CPU present's picture.
# Run: scripts/3ds/run-azahar.sh --script scripts/3ds/tests/input/13-bottom-screen.txt --c3d scripts/3ds/tests/c3d/m1-present-diff.cfg build-3ds-c3d-prof/alephone.3dsx
# (also with 08-demo-close.txt)
# Expect: "present_diff final: N checks, 0 with RGB differences", walls checks compared with 0 non-edge
# mismatches, prog_restore_mismatch=0, release done.
present gpu
present_diff 30
renderer c3d
diff 15
diff_frames 40
classes walls
