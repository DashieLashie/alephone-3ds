# M0 acceptance (d): null mode. The rasteriser-shaped counter sees every primitive of the traversal
# (polygons, rectangles, vertices V, fan indices I, state changes, distinct texture/shading-table
# pairs), draws nothing; the caller then draws in SW as always. Its time is the zone c3d_null (R).
# Run: SCENARIO_SRC=".../Marathon 2" scripts/3ds/run-azahar.sh --perf 0 --c3d scripts/3ds/tests/c3d/m0-null.cfg build-3ds-c3d-prof/alephone.3dsx
# or a series: C3D=scripts/3ds/tests/c3d/m0-null.cfg scripts/3ds/tests/perf-bench.sh LABEL build-3ds-c3d-prof/alephone.3dsx
# Expect: BENCH lines with c3d_null > 0, "[c3d] null frames=N polys max=... p99=..." every 300 null frames
# and at release. Benchmark-only (null mode is a second traversal per frame).
renderer c3d
mode null
