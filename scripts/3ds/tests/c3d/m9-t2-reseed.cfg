# M9 part 3, A1 (design 7, M9 "What the two textures hold"): a seeded stereo frame with no flat frame before it. reseed 10 forgets the
# view texture every 10th direct frame (as after a new dest of the same size), so the next frame is seeded from dest while the stereo
# state is unchanged (prev = 1). T2's identity (stereo_force, slider 0, stereo_check 5): the right eye must be copied from the freshly
# seeded left one or the eyes differ at any pixel no draw covers.
# Run: scripts/3ds/run-azahar.sh --perf 0 --c3d scripts/3ds/tests/c3d/m9-t2-reseed.cfg build-3ds-c3d-prof/alephone.3dsx
# Expect: "[c3d] reseed test" lines with prev=1; "stereo final"/last "stereo:" line r_copies = 1 + reseeds; every stereo_check differ=0.
renderer c3d
mode direct
play 1
textures 1
lit 1
overlays 1
direct_check 30
stereo 1
stereo_force 1
stereo_slider 0
stereo_check 5
stereo_fill 0
reseed 10
