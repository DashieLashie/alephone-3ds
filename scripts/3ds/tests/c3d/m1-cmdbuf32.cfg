# M1 acceptance: a 32 KiB command buffer (design 7 "M1 specification"). The class walls of 20 diff frames is drawn by SW (side A)
# and by one C3D view frame (side B, read back keeping alpha), and compared (coverage rule 8.3, band-pct).
# Run: SCENARIO_SRC=".../Marathon 2" scripts/3ds/run-azahar.sh --perf 0 --c3d scripts/3ds/tests/c3d/m1-cmdbuf32.cfg build-3ds-c3d-prof/alephone.3dsx
# Expect: walls compare or "discarded (cmdbuf)" when the reserve fails; the present still works; no crash
# Then: python3 -I scripts/3ds/tests/c3d-diff.py log <log> --coverage walls --band-pct 2 --min-checks 20
renderer c3d
diff 1
diff_frames 20
classes walls
dump 1
cmdbuf_kib 32
