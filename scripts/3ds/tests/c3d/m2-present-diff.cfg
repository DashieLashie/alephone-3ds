# M2: the present is unharmed by textured view frames (design 7, M2 "Texture binding and its restore"): walls and
# floors diff frames bind their own textures to unit 0 and restore the present's (the C3D_TexBind record), with the
# GPU present's self-check every 30th present.
# Run: scripts/3ds/run-azahar.sh --script scripts/3ds/tests/input/13-bottom-screen.txt --c3d scripts/3ds/tests/c3d/m2-present-diff.cfg build-3ds-c3d-prof/alephone.3dsx
# Expect: "present_diff final: N checks, 0 with RGB differences", tex_restore_mismatch=0, prog_restore_mismatch=0, release done.
present gpu
present_diff 30
renderer c3d
diff 15
diff_frames 40
classes walls,floors
fullbright 1
textures 1
play 0          # M4: no C3D play frames, as before M4 (design 7, M4 specification "Keys")
