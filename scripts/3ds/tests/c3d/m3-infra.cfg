# M3 acceptance: infravision (shadeless kinds, texcoord1 (1, 1)) on walls and floors, in C3D against SW (design 7 "M3
# specification", "The infravision plugin"). The first check at frame 15, after the plugin's Triggers.init.
# Run: scripts/3ds/run-azahar.sh --perf 0 --infravision-test --c3d scripts/3ds/tests/c3d/m3-infra.cfg build-3ds-c3d-prof/alephone.3dsx
# Then: c3d-diff.py log <log> --colour walls,floors --shading infra --nonedge-pct 0.1 --within 98 --tol 2 --mean 1.0 --min-checks 20
renderer c3d
diff 15
diff_frames 20
classes walls,floors
fullbright 0
textures 1
lit 1
diff_tol 2
dump 0
