# Plan B-b: the zero-copy present with the present_diff self-check (as p1-diff.cfg). Every 30th
# present the picture the CPU present would show is compared with what the GPU put in the
# framebuffer. Expect "[c3d] present_diff: ... 0 of 96000 pixels differ in RGB (0 in A only)" and,
# at exit/release, "[c3d] present_diff final: N checks, 0 with RGB differences". That is the proof
# of the three channel draws (one-channel write masks, TEV channel operands: design 5.7.10 items
# 2 and 4). Not for benchmark figures.
present gpu
zero_copy 1
present_diff 30
