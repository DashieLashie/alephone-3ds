# M9 fix, console diagnostic (KICKOFF_M9_FIX.md step 2): is the sky drawn on the hardware on stereo frames?
# m9-console.cfg (hardware slider, every stereo key at its default, fill 1) plus stereo_gaps 1: both eye textures are cleared to
# magenta on every stereo frame, then the centre pass and the shifted pass are drawn. In Azahar no pixel stays magenta with fill 1
# (Waterloo Waterpark film: 798 samples, 792 with 0 pixels, max 6). On the console, slider up, on L0 looking at the sky:
#   the sky area is magenta        -> the hardware does not draw the landscape on stereo frames (its vertices carry w = 2^24)
#   no magenta (a rare speck only) -> everything is drawn; the bleed is the fill pass's centre-view content beside the sky
# Every 30th stereo frame the left view is read back for the count ("[c3d] stereo_gaps: ... gap_px=N"): a small hitch is expected.
renderer c3d
mode direct
play 1
textures 1
lit 1
overlays 2
stereo 1
stereo_gaps 1
