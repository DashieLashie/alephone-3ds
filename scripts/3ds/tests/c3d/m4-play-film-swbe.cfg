# M4 acceptance, Azahar software backend: m4-play-film.cfg plus `gxq_budget 3` (M3's Azahar fault: the software
# rasteriser faults when one draw samples FCRAM and VRAM textures). Play mode over the film M2 L01 Waterloo Waterpark
# (design 7, M4 specification "Play mode"); every 30th C3D play frame is compared with SW's replay ("DIFF ... class=play").
# Run with AZAHAR_GRAPHICS_API=0.
# Run: scripts/3ds/run-azahar.sh --c3d scripts/3ds/tests/c3d/m4-play-film-swbe.cfg --film "tests/replays/Marathon 2/Tooncinator Films/M2 L01 Waterloo Waterpark.46857.filA" --timeout 500 build-3ds-c3d-prof/alephone.3dsx
# Then: python3 -I scripts/3ds/tests/c3d-diff.py play <log> --min-play-checks 1 --within 97 --tol 4
renderer c3d
gxq_budget 3     # Azahar software backend: all linear (M3)
play 1
play_check 30
textures 1
lit 1
diff_tol 4
film c3d-film.filA
