# M6: the frame-indexed test in direct mode (design 7, M6 specification "Calibration"; 5.1's test): each direct frame
# draws the frame-indexed colour of the present that shows it, corner quads and rows 240-255 magenta, and one white band at
# row 8 * (n mod 30). Captures c3d-cal-N at presents 120.., 600.., 1200.., 1800..: colour and band of N or N-1.
# Run at Framerate Target 30 and 60: PREFS="fps_target=30|60" LEVELS=0 C3D=scripts/3ds/tests/c3d/m6-cal.cfg perf-bench.sh
renderer c3d
play 1
textures 1
lit 1
mode direct
calibrate 1
alt_load 1
