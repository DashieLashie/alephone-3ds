# M9 console check (NEXT-SPRINT.md "M9 console check"): stereo on the hardware slider (no stereo_slider key), every other key at its
# default (stereo_k 96 = 6 px per eye at slider 1, stereo_w0 1024, stereo_near 100, stereo_weapon -50, stereo_ramp 15, stereo_fill 1).
# overlays 2 = position + crosshair on the top screen (the crosshair sits at zero parallax).
renderer c3d
mode direct
play 1
textures 1
lit 1
overlays 2
stereo 1
