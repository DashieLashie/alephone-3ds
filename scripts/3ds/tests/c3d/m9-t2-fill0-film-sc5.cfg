# M9 part 2 review follow-up: as m9-t2-fill0-film.cfg but stereo_check 5 (denser: the window after a right-eye copy is a few frames wide).
# m9-t2-fill0 over the L01 film (run-azahar.sh --c3d m9-t2-fill0-film.cfg --film FILM --timeout 500 ...).
renderer c3d
mode direct
play 1
textures 1
lit 1
overlays 1
direct_check 30
overlay_audit 30
stereo 1
stereo_force 1
stereo_slider 0
stereo_check 5
stereo_fill 0
film c3d-film.filA
