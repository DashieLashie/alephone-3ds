# M3: the present is unharmed by lit view frames (design 7, M3 "Binding and the state the present relies on"): walls
# and floors diff frames bind the shade LUT to unit 1 (it stays bound), set TEV stage 1 and put it back, with the GPU
# present's self-check every 30th present.
# Run: scripts/3ds/run-azahar.sh --script scripts/3ds/tests/input/13-bottom-screen.txt --c3d scripts/3ds/tests/c3d/m3-present-diff.cfg build-3ds-c3d-prof/alephone.3dsx
# Expect: "present_diff final: N checks, 0 with RGB differences", tex_restore_mismatch=0, tex1_restore_mismatch=0,
# tev1_not_init=0, prog_restore_mismatch=0, lut=vram, release done.
present gpu
present_diff 30
renderer c3d
diff 15
diff_frames 40
classes walls,floors
fullbright 0
textures 1
lit 1
diff_tol 4
