# M5: the present diff with play frames that draw static, on a run that exits cleanly. The L06 film run
# (m5-present-diff.cfg) is killed at the film's end before the "present_diff final" line; L0's bench spot shows static
# (play mode: ~45 static frames) and the benchmark quits by itself, as M4's present runs did.
# Run: scripts/3ds/run-azahar.sh --perf 0 --c3d scripts/3ds/tests/c3d/m5-present-diff-l0.cfg build-3ds-c3d-prof/alephone.3dsx
# Expect: "present_diff final: N checks, 0 with RGB differences", the restore counters 0, static_sets > 0.
present gpu
present_diff 30
renderer c3d
play 1
textures 1
lit 1
