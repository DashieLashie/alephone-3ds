# M2 acceptance (session 2): walls and floors textured, full bright, in C3D against SW (design 7 "M2 specification").
# 200 checks (every 2nd frame) of the film M2 L01 Waterloo Waterpark.
# Run: scripts/3ds/run-azahar.sh --c3d scripts/3ds/tests/c3d/m2-film.cfg --film "tests/replays/Marathon 2/Tooncinator Films/M2 L01 Waterloo Waterpark.46857.filA" --timeout 400 build-3ds-c3d-prof/alephone.3dsx
# Then: c3d-diff.py log <log> --colour walls,floors ... --min-checks 200
renderer c3d
diff 2
diff_frames 200
classes walls,floors
fullbright 1
textures 1
dump 0
film c3d-film.filA
play 0          # M4: no C3D play frames, as before M4 (design 7, M4 specification "Keys")
