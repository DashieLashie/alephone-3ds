# M6: direct mode (design 7, M6 specification): play frames stay on the GPU, overlays composited; in-frame checks.
# Run: scripts/3ds/run-azahar.sh --perf 0 --c3d scripts/3ds/tests/c3d/m6-direct.cfg build-3ds-c3d-prof/alephone.3dsx
# Expect: "[c3d] direct final" with direct > 0; every "[c3d] direct_check:" within_1 >= 99.9 % and over_32=0;
# "composite final" leaks=0; "seed_check: 0 of 96000 pixels differ".
renderer c3d
mode direct
play 1
textures 1
lit 1
overlays 1
direct_check 30
overlay_audit 30
seed_check 1
