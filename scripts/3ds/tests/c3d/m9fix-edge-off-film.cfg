# M9 fix, the edge strip: the negative control of m9fix-edge-film.cfg (stereo_edge 0 = M9's behaviour). The L01 film at slider 100 with stereo_fill 0 and
# stereo_gaps 1: both eye textures are cleared to magenta, so every pixel no shifted pass covers is counted, every 30th
# stereo composite. "edge columns" are the gaps in the 8 outer columns each side: where the engine's clipping left a
# shifted eye without content before the fix.
# Run: scripts/3ds/run-azahar.sh --c3d scripts/3ds/tests/c3d/m9fix-edge-off-film.cfg --film FILM --timeout 500 build-3ds-c3d-prof/alephone.3dsx
#      (FILM = tests/replays/Marathon 2/Tooncinator Films/M2 L01 Waterloo Waterpark.46857.filA of the main checkout)
# Expect: the edge-column count averages several hundred px per sample (M9: 769.8); "stereo final" edge=0/0.
renderer c3d
mode direct
play 1
textures 1
lit 1
stereo 1
stereo_slider 100
stereo_fill 0
stereo_gaps 1
stereo_edge 0
film c3d-film.filA
