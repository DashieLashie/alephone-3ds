# M5 acceptance: eviction under pressure in play mode (design 7, M5 specification "Accept"): every world frame C3D
# can draw is drawn by citro3d, landscapes included, with a 512 KiB VRAM pool, so promotions evict (LRU) and the
# landscape parts compete with the walls. Host-GPU backend only.
# Run: scripts/3ds/run-azahar.sh --perf 6 --c3d scripts/3ds/tests/c3d/m5-vram512.cfg build-3ds-c3d-prof/alephone.3dsx (L0/L6/L20)
# Then: c3d-diff.py play <log> --min-play-checks 1 --within 97 --tol 4; the texcache lines show evictions and "audit ok".
renderer c3d
play 1
play_check 30
textures 1
lit 1
diff_tol 4
vram_cap 512
