# M5 acceptance: a film, diff every 30th frame, the landscape, static, sprite, weapon and full-frame classes (design 7
# "M5 specification", "Films"). The film is chosen with --film (L01, L06, L10, L16, L21; screening in PERF.md M5).
# Run: scripts/3ds/run-azahar.sh --c3d scripts/3ds/tests/c3d/m5-film.cfg --film "tests/replays/Marathon 2/Tooncinator Films/<film>" --timeout 260 build-3ds-c3d-prof/alephone.3dsx
# Software backend: m5-film-swbe.cfg (gxq_budget 3).
renderer c3d
diff 30
diff_frames 120       # the DIFF summary prints at the 120th check (a killed run prints none)
classes landscape,static,sprites,weapons,frame
fullbright 0
textures 1
lit 1
diff_tol 4
landscape_tol 2
dump 0
film c3d-film.filA
play 0          # diff runs only
