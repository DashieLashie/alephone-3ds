# M1 discard test (design 7, Reserves and the command buffer): reserve_extra refuses a draw MID frame. L0's view frame uses
# about 952 words, ~254 at most per draw; with 131072 words the test passes while the offset is below
# 131072 - (536 + 20) - extra (M2: 536), so extra = 130020 admits offset <= 496 (L0 uses ~952): the first draw (254 words with the state flush) and
# several more, then refuses.
# Run: scripts/3ds/run-azahar.sh --perf 0 --c3d scripts/3ds/tests/c3d/m1-reserve-mid.cfg build-3ds-c3d-prof/alephone.3dsx
# Expect: walls checks discarded (reason cmdbuf) after some draws were issued (the discard path flushes the ring), no crash.
renderer c3d
diff 1
diff_frames 20
classes walls
reserve_extra 130020
# textures 0: M1 flat colour (the default became 1 in M2 part 7)
textures 0
play 0          # M4: no C3D play frames, as before M4 (design 7, M4 specification "Keys")
