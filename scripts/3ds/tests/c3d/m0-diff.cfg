# M0 acceptance (c): the in-frame SW-vs-SW diff (design 7 "M0 specification", 8.1). One traversal is
# recorded; the full frame (check "replay") and every class (walls floors landscape static sprites
# weapons tinted other frame) are replayed into scratch A and scratch B, and compared. Both sides are
# SW in M0, so every differ must be 0. 20 diff frames (every world frame), then the summary.
# Run: SCENARIO_SRC=".../Marathon 2" scripts/3ds/run-azahar.sh --perf 0 --c3d scripts/3ds/tests/c3d/m0-diff.cfg build-3ds-c3d-prof/alephone.3dsx
# Expect: 20 x 10 "[c3d] DIFF frame=... differ=0" lines and "[c3d] DIFF summary frames=20 checks=200
# differ_total=0 dropped=0"; then check with: python3 -I scripts/3ds/tests/c3d-diff.py log <log> --expect-zero
# Costs ~3 MiB and several ms per diff frame: not for benchmark figures.
renderer sw
diff 1
diff_frames 20
classes all
