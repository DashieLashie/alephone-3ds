# M3 acceptance: walls and floors lit, in C3D against SW (design 7 "M3 specification"), 200 checks (every 2nd frame)
# of the film M2 L08 Nuke and Pave (the one level with a light that can go negative; c3d_neg_ambient_polys, c3d_ambient_wrap).
# Run: scripts/3ds/run-azahar.sh --c3d scripts/3ds/tests/c3d/m3-film-l08.cfg --film "tests/replays/Marathon 2/Tooncinator Films/M2 L08 Nuke and Pave.682.filA" --timeout 400 build-3ds-c3d-prof/alephone.3dsx
# Azahar's software backend (AZAHAR_GRAPHICS_API=0) crashes when a draw samples textures from FCRAM and VRAM together
# (design Review log "M3 acceptance, software-backend films"): under it add `gxq_budget 3` (no promotions: all linear).
# Then: c3d-diff.py log <log> --colour walls,floors --shading lit --nonedge-pct 0.1 --within 98 --tol 4 --mean 1.5 --min-checks 200
renderer c3d
diff 2
diff_frames 200
classes walls,floors
fullbright 0
textures 1
lit 1
diff_tol 4
dump 0
film c3d-film.filA
play 0          # M4: no C3D play frames, as before M4 (design 7, M4 specification "Keys")
