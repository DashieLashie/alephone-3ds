# M1 ring sizes, measured first (design 7 "M1 specification", Ring sizes). Null mode counts every primitive of the
# traversal (vertices V, fan indices I) and draws nothing; the maxima and p99 size the ring halves (2 x max, up to 1 024).
# Demo variant: scripts/3ds/run-azahar.sh --script scripts/3ds/tests/input/12-sprite-check.txt --c3d scripts/3ds/tests/c3d/m1-null-ring.cfg build-3ds-c3d-prof/alephone.3dsx
# Film variant: add the film key below (or run with --film FILE; the key names the staged file c3d-film.filA).
# Expect: "[c3d] null frames=N ... vertices max ... indices max ..." at exit.
renderer c3d
mode null
film c3d-film.filA
