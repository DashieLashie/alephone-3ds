# M4 acceptance (software backend, all linear): sprites, weapons and the full frame (landscapes and static excluded on both sides), lit, C3D vs SW
# (design 7 "M4 specification"). 20 checks a run. Under AZAHAR_GRAPHICS_API=0 (Azahar's software backend) add
# `gxq_budget 3` (all linear): that rasteriser faults when one draw samples FCRAM and VRAM textures (M3).
# Run: SCENARIO_SRC=".../Marathon 2" scripts/3ds/run-azahar.sh --perf 0 --c3d scripts/3ds/tests/c3d/m4-diff.cfg build-3ds-c3d-prof/alephone.3dsx (L0/L6/L20 = --perf 0/6/20)
# Then: python3 -I scripts/3ds/tests/c3d-diff.py log <log> --colour sprites,weapons --shading lit --nonedge-pct 0.5 --within 98 --tol 4 --mean 1.5 --min-checks 20 --min-covered 2000 --min-covered-checks 10
#  and: python3 -I scripts/3ds/tests/c3d-diff.py log <log> --colour frame --shading lit --within 97 --tol 4 --mean 255 --min-checks 20
renderer c3d
diff 1
diff_frames 20
classes sprites,weapons,frame
fullbright 0
textures 1
lit 1
diff_tol 4
dump 0
gxq_budget 3     # Azahar software backend: all linear (M3)
play 0          # diff runs only: play mode has its own runs (m4-play*.cfg; critic M4 code review, minor 6)
