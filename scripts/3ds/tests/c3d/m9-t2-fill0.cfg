# M9 part 1, T2 (identity, stereo_fill 0: the shifted pass only; design 7, M9 specification "Tests"): the full stereo path at zero parallax. stereo_force 1 with
# stereo_slider 0: every direct frame takes the stereo path (draw list, right-eye replay passes, two-eye composite) with
# P = 0, so the right framebuffer must equal the left pixel for pixel, 3D mode on and the two buffers distinct.
# Run: scripts/3ds/run-azahar.sh --perf 0 --c3d scripts/3ds/tests/c3d/m9-t2-fill0.cfg build-3ds-c3d-prof/alephone.3dsx
# Expect: every "[c3d] stereo_check:" differ=0 is3d=1 distinct=1; "composite final" stereo_check_bad=0; every direct_check
# within_1 >= 99.9 % and over_32=0; "stereo final" stereo= equal to direct=, replay_discards 0.
renderer c3d
mode direct
play 1
textures 1
lit 1
overlays 1
direct_check 30
overlay_audit 30
stereo 1
stereo_force 1
stereo_slider 0
stereo_check 30
stereo_fill 0
