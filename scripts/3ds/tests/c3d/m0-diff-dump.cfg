# M0: as m0-diff.cfg, with the images of the first diff frame's checks (and of any check with
# differ > 0) saved as c3d-diff-<frame>-<class>-{sw,c3d}.bmp (at most 32 files; run-azahar.sh
# converts them to PNG in build-3ds/azahar-screens/). 3 diff frames.
# Run: SCENARIO_SRC=".../Marathon 2" scripts/3ds/run-azahar.sh --perf 0 --c3d scripts/3ds/tests/c3d/m0-diff-dump.cfg build-3ds-c3d-prof/alephone.3dsx
# Expect: 20 files for the first diff frame (the replay check and the 9 classes, two images each; the
# limit is 32 per run), all differ=0. Compare a pair with: python3 -I scripts/3ds/tests/c3d-diff.py bmp A.bmp B.bmp
renderer sw
diff 1
diff_frames 3
classes all
dump 1
