# Plan B-a (design 5.7.4, 5.7.11): the GPU present as two C3D frames. Frame U: staging fill,
# flush, the upload transfer, nothing drawn; frame D: waits for U (zone c3d_upload), then the
# quad and the framebuffer transfer. Same bytes on screen as p1-gpu.cfg; only the cost structure
# differs. Measure with a profile build (zones c3d_wait, c3d_fill, c3d_upload, c3d_vblank;
# perf-table.py adds "present total"), against p1-gpu.cfg (two_frame 0) on the same build.
# The stats line then carries "gpu_ms draw=X upload=Y" (C3D_GetDrawingTime).
present gpu
two_frame 1
