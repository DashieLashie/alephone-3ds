# M9 console check: T2's identity on the console. stereo_force 1 with stereo_slider 0 makes every direct frame a stereo frame at zero
# parallax; every 5th composite compares the right framebuffer with the left (stereo_check): 0 differing pixels on every check, across a
# map -> play re-entry, a terminal, a quit to the menu and a new game (the right eye is copied from the left each time).
renderer c3d
mode direct
play 1
textures 1
lit 1
overlays 1
stereo 1
stereo_force 1
stereo_slider 0
stereo_check 5
stereo_fill 0
