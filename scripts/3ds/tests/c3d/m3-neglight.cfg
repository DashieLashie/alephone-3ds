# M3 negative-ambient test (design 7 "M3 specification"; KICKOFF_M4.md piece 0): m3-diff.cfg with the Negative Light Test plugin.
# 20 checks a run.
# Run: SCENARIO_SRC=".../Marathon 2" scripts/3ds/run-azahar.sh --perf 0 --negative-light-test --c3d scripts/3ds/tests/c3d/m3-neglight.cfg build-3ds-c3d-prof/alephone.3dsx (AZAHAR_GRAPHICS_API=0 = software)
# Then: python3 -I scripts/3ds/tests/c3d-diff.py log <log> --colour walls,floors --shading lit --nonedge-pct 0.1 --within 98 --tol 4 --mean 1.5 --min-checks 20; and c3d_neg_ambient_polys > 0, c3d_ambient_wrap 0 in the summary
renderer c3d
diff 1
diff_frames 20
classes walls,floors
fullbright 0
textures 1
lit 1
diff_tol 4
dump 0
play 0          # M4: no C3D play frames, as before M4 (design 7, M4 specification "Keys")
