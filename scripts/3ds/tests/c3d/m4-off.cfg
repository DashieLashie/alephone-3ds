# M4: "10 discards in a row -> off until the next level" (design 7, M4 specification "Play mode" (4)): an impossible
# command-buffer reserve makes every C3D play frame discard (cmdbuf); with the Level Hop Test plugin (run-azahar.sh
# --level-hop-test: the next level 10 s in) on L20's bench spot (no sky, so frames reach the GPU) the renderer must go
# off on level 20, on again at the level change, and off again on level 21.
# Run: scripts/3ds/run-azahar.sh --perf 20 --level-hop-test --c3d scripts/3ds/tests/c3d/m4-off.cfg build-3ds-c3d-prof/alephone.3dsx
# Then: python3 -I scripts/3ds/tests/c3d-diff.py play <log> --expect-offs 2   (expected to report c3d=0: no C3D frame)
renderer c3d
play 1
textures 1
lit 1
reserve_extra 1000000
