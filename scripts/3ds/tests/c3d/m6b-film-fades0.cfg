# M6b regression: fades 0 over the L01 film reproduces M6 (every fade frame not direct, blocked=gamma);
# every 30th direct frame checked (fade frames against SW's apply_gamma).
# Run: scripts/3ds/run-azahar.sh --c3d scripts/3ds/tests/c3d/m6b-film-fades0.cfg --film FILM --timeout 500 build-3ds-c3d-prof/alephone.3dsx
renderer c3d
play 1
textures 1
lit 1
mode direct
overlays 1
direct_check 30
overlay_audit 30
film c3d-film.filA
fades 0
