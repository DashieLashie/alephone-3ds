# M5 acceptance: hard texture failures in play mode (design 7, M5 specification "fail_every"): every 50th texture-cache
# create() fails before allocating, the frame is discarded `tex` and SW draws it; over the L01 film.
# Run: scripts/3ds/run-azahar.sh --c3d scripts/3ds/tests/c3d/m5-fail50.cfg --film "tests/replays/Marathon 2/Tooncinator Films/M2 L01 Waterloo Waterpark.46857.filA" --timeout 500 build-3ds-c3d-prof/alephone.3dsx
# Then: c3d-diff.py play <log> --min-play-checks 1 --within 97 --tol 4; the texcache lines: forced >= 10, "audit ok".
renderer c3d
play 1
play_check 30
textures 1
lit 1
diff_tol 4
fail_every 50
film c3d-film.filA
