# M4 acceptance: sprites, weapons, tinted and the full frame (landscapes and static excluded both sides), lit, in C3D against SW (design 7 "M4 specification"), 200 checks (every 2nd frame)
# of the film M2 L08 Nuke and Pave (the one level with a light that can go negative; c3d_neg_ambient_polys, c3d_ambient_wrap).
# Run: scripts/3ds/run-azahar.sh --c3d scripts/3ds/tests/c3d/m4-film-l08.cfg --film "tests/replays/Marathon 2/Tooncinator Films/M2 L08 Nuke and Pave.682.filA" --timeout 400 build-3ds-c3d-prof/alephone.3dsx
# Azahar's software backend (AZAHAR_GRAPHICS_API=0) crashes when a draw samples textures from FCRAM and VRAM together
# (design Review log "M3 acceptance, software-backend films"): under it add `gxq_budget 3` (no promotions: all linear).
# Then: c3d-diff.py log <log> --colour sprites,weapons --shading lit --nonedge-pct 0.5 --within 98 --tol 4 --mean 1.5 --min-checks 200 --min-covered 20000 --min-covered-checks 100
#  and: c3d-diff.py log <log> --colour frame --shading lit --within 97 --tol 4 --mean 255 --min-checks 200 (tinted: recorded; gated if it has checks: --colour tinted --strict tinted --within 98 --tol 4 --mean 255)
renderer c3d
gxq_budget 3     # Azahar software backend: all linear (M3)
diff 2
diff_frames 200
classes sprites,weapons,tinted,frame
fullbright 0
textures 1
lit 1
diff_tol 4
dump 0
film c3d-film.filA
