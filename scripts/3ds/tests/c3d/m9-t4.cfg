# M9 part 2, T4 (design 7, M9 specification "Tests"): gap count. stereo_gaps 1 with stereo_fill 0 (the shifted pass only) at slider 100:
# both eye textures are cleared to magenta on every stereo frame and every 30th stereo composite the left view is read back;
# gap_px = the magenta pixels in 400x240. Reported, not gated: the evidence for the gap fill (D2).
# Run: scripts/3ds/run-azahar.sh --perf 0 --c3d scripts/3ds/tests/c3d/m9-t4.cfg build-3ds-c3d-prof/alephone.3dsx (also --perf 6 / 20)
# Expect: "[c3d] stereo_gaps: ... gap_px=N" lines; "composite final" gap_avg / gap_max.
renderer c3d
mode direct
play 1
textures 1
lit 1
stereo 1
stereo_slider 100
stereo_fill 0
stereo_gaps 1
