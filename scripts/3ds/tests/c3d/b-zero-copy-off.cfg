# Plan B-b (design 5.7.7, measurement side A): the P1 present. zero_copy 0: the engine allocates
# main_surface itself and every present goes through the staging image, one C3D frame each. Note
# that on this branch every config WITHOUT the zero_copy key runs zero-copy (default 1), so this
# file is the only way to get the P1 present from the same build. Acts from the next game screen
# setup: put this file on the card before launching.
present gpu
zero_copy 0
