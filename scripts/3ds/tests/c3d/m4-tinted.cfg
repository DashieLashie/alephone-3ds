# M4 acceptance: tinted rectangles (invisibility) over the grey clear of 8.1, and the full frame with them; needs the
# Invisibility Test plugin (run-azahar.sh --invisibility-test: the player's weapon is tinted on every frame; with an
# invisible player every weapon is `tinted`, so `weapons` is not listed). diff 15: the first check after the plugin's
# init. Software backend: add `gxq_budget 3` (M3's Azahar fault).
# Run: SCENARIO_SRC=".../Marathon 2" scripts/3ds/run-azahar.sh --perf 0 --invisibility-test --c3d scripts/3ds/tests/c3d/m4-tinted.cfg build-3ds-c3d-prof/alephone.3dsx
# Then: python3 -I scripts/3ds/tests/c3d-diff.py log <log> --colour tinted --shading lit --strict tinted --nonedge-pct 0.5 --within 98 --tol 3 --mean 255 --min-checks 20 --min-covered 2000 --min-covered-checks 10
#  and: python3 -I scripts/3ds/tests/c3d-diff.py log <log> --colour frame --shading lit --within 97 --tol 3 --mean 255 --min-checks 20
renderer c3d
diff 15
diff_frames 20
classes tinted,frame
fullbright 0
textures 1
lit 1
diff_tol 3
dump 0
