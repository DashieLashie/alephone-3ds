# M3 acceptance: walls and floors textured and lit (shade LUT, two TEV stages), in C3D against SW (design 7 "M3 specification").
# 20 checks a run, with the TEV alpha scaled x2 (the UNVERIFIED clamp A/B; M5 static depends on it). Recorded, not gated.
# Run: SCENARIO_SRC=".../Marathon 2" scripts/3ds/run-azahar.sh --perf 0 --c3d scripts/3ds/tests/c3d/m3-alpha2.cfg build-3ds-c3d-prof/alephone.3dsx (L0/L6/L20 = --perf 0/6/20; AZAHAR_GRAPHICS_API=0 = software)
# Then: python3 -I scripts/3ds/tests/c3d-diff.py log <log> --colour walls,floors --shading lit --nonedge-pct 0.1 --within 98 --tol 4 --mean 1.5 --min-checks 20
renderer c3d
diff 1
diff_frames 20
classes walls,floors
fullbright 0
textures 1
lit 1
diff_tol 4
dump 0
alpha_x2 1
play 0          # M4: no C3D play frames, as before M4 (design 7, M4 specification "Keys")
