# M5 acceptance: play mode on (design 7, M5 specification "Play mode"): every world frame C3D can draw, landscapes and
# static included, is drawn by citro3d and read back; every 30th C3D play frame is compared with SW's replay over the
# same previous frame ("DIFF ... class=play"; a frame with static leaves SW's static coverage out: `excluded=`).
# Used with the scripts 06, 07, 12, 13, 14, the films and Classic L20. Software backend: m5-play-swbe.cfg (gxq_budget 3).
# With --film: add the line below. Then: c3d-diff.py play <log> --min-play-checks 1 --within 97 --tol 4
renderer c3d
play 1
play_check 30
textures 1
lit 1
diff_tol 4
film c3d-film.filA
gxq_budget 3
