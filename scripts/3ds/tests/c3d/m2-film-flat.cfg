# M2 interim (session 1, part 5): walls and floors in C3D against SW over a film, textures off (coverage only).
# 200 diff frames (every 2nd frame) of the replay of M2 L01 Waterloo Waterpark.
# Run: scripts/3ds/run-azahar.sh --c3d scripts/3ds/tests/c3d/m2-film-flat.cfg --film "tests/replays/Marathon 2/Tooncinator Films/M2 L01 Waterloo Waterpark.46857.filA" --timeout 400 build-3ds-c3d-prof/alephone.3dsx
# (SCENARIO_SRC="<main checkout>/data/Scenarios/Marathon 2" in a worktree)
# Then: python3 -I scripts/3ds/tests/c3d-diff.py log <log> --coverage walls,floors --band-pct 2 --min-checks 200
renderer c3d
diff 2
diff_frames 200
classes walls,floors
textures 0
dump 0
film c3d-film.filA
