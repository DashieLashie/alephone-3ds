# M9 fix, the edge strip (design 7, "M9 fix: the edge strip"): the gate. The L01 film at slider 100 with stereo_fill 0 and
# stereo_gaps 1: both eye textures are cleared to magenta, so every pixel no shifted pass covers is counted, every 30th
# stereo composite. "edge columns" are the gaps in the 8 outer columns each side: where the engine's clipping left a
# shifted eye without content before the fix.
# Run: scripts/3ds/run-azahar.sh --c3d scripts/3ds/tests/c3d/m9fix-edge-film.cfg --film FILM --timeout 500 build-3ds-c3d-prof/alephone.3dsx
#      (FILM = tests/replays/Marathon 2/Tooncinator Films/M2 L01 Waterloo Waterpark.46857.filA of the main checkout)
# Expect: over the "[c3d] stereo_gaps:" lines the edge-column count averages under 10 px per sample (M9: 769.8, the same
# build with m9fix-edge-off-film.cfg: the same), its median 0; "stereo final" edge=N/0 (strips drawn / not drawn) with
# N > 0, w_low 0, replay_discards 0; "play" discard=0/0/..., ring_hw_v well under ring_vertices (2 048).
renderer c3d
mode direct
play 1
textures 1
lit 1
stereo 1
stereo_slider 100
stereo_fill 0
stereo_gaps 1
film c3d-film.filA
