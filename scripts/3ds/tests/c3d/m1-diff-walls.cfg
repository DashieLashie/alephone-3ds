# M1 acceptance: walls in C3D against SW (design 7 "M1 specification"). The class walls of 20 diff frames is drawn by SW (side A)
# and by one C3D view frame (side B, read back keeping alpha), and compared (coverage rule 8.3, band-pct).
# Run: SCENARIO_SRC=".../Marathon 2" scripts/3ds/run-azahar.sh --perf 0 --c3d scripts/3ds/tests/c3d/m1-diff-walls.cfg build-3ds-c3d-prof/alephone.3dsx
# Expect: 20 x "[c3d] DIFF frame=... class=walls ... b=c3d excluded=N sentinel=0"; no discards; a [c3d] cmdbuf line
# Then: python3 -I scripts/3ds/tests/c3d-diff.py log <log> --coverage walls --band-pct 2 --min-checks 20
renderer c3d
diff 1
diff_frames 20
classes walls
dump 1
