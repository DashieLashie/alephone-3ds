# M1 acceptance: walls in C3D against SW over a film (design 7 "M1 specification", Film). 200 diff frames
# (every 2nd frame) of the replay of M2 L01 Waterloo Waterpark, walls drawn by SW and by one C3D view frame each.
# Run: scripts/3ds/run-azahar.sh --c3d scripts/3ds/tests/c3d/m1-film.cfg --film "tests/replays/Marathon 2/Tooncinator Films/M2 L01 Waterloo Waterpark.46857.filA" --timeout 400 build-3ds-c3d-prof/alephone.3dsx
# (SCENARIO_SRC="<main checkout>/data/Scenarios/Marathon 2" in a worktree)
# Expect: "[c3d] film: ... (handed to the engine ...)", "[3ds] argv[1] = ...", 200 DIFF lines class=walls, a [c3d] cmdbuf line
# Then: python3 -I scripts/3ds/tests/c3d-diff.py log <log> --coverage walls --band-pct 2 --min-checks 200
renderer c3d
diff 2
diff_frames 200
classes walls
dump 1
film c3d-film.filA
