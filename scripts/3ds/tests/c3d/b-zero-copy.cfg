# Plan B-b (design 5.7, measurement side B): the zero-copy present. The 400x240 game surface
# (HUD + Map) is a 512 KiB linear buffer the GPU reads directly: frame U flushes it and uploads it
# (no staging fill), frame D draws it with three one-channel masked draws. 640x480 (menus,
# Classic) takes the staging path unchanged. Acts from the next game screen setup: put this file
# on the card before launching. Compare with b-zero-copy-off.cfg on the same build.
# The stats line carries "gpu_ms draw=X upload=Y" (C3D_GetDrawingTime).
present gpu
zero_copy 1
