# M6: the sync path (critic, M6 round 1 minor 7): every 50th play frame is forced to SW, so the texture's view is read back
# into dest first (syncs > 0) and the next direct frame is seeded; direct_check still passes after each seed.
# Run: scripts/3ds/run-azahar.sh --perf 0 --c3d scripts/3ds/tests/c3d/m6-sync.cfg build-3ds-c3d-prof/alephone.3dsx
renderer c3d
play 1
textures 1
lit 1
mode direct
sw_every 50
overlays 1
direct_check 30
overlay_audit 30
